{% extends "base.html" %}

{% block title %}Delete Student &middot; Student Management System{% endblock %}

{% block content %}
<h1>Delete Student</h1>

<div class="card">
    <p>
        Are you sure you want to delete
        <strong>{{ student.name }}</strong> ({{ student.roll_no }})?
        This action cannot be undone.
    </p>
    <form method="post" action="{{ url_for('students.delete_student', student_id=student.id) }}">
        <button class="btn btn-danger" type="submit">Yes, delete</button>
        <a class="btn btn-secondary" href="{{ url_for('students.student_detail', student_id=student.id) }}">Cancel</a>
    </form>
</div>
{% endblock %}
